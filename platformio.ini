; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; One environment per car. Each car has its own folder in src/cars/ with the calibration
; (calibration_data.cpp, generated by tools/egs_cal_gen.py) and the vehicle settings (vehicle_config.cpp).
; Build and flash one with: pio run -e w124_210_016 -t upload
[platformio]
default_envs = w124_210_016

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

lib_deps = 
    autowp/autowp-mcp2515@^1.3.1

; Daniel's W124: W210 E270 CDI (210.016) EDC15C6, EWM and 722.634
[env:w124_210_016]
build_src_filter = +<*> -<cars/> +<cars/w124_210_016/>

; W202 C220 CDI (202.194): CR1 EDC15, 722.614 or 722.699, rear wheel speeds from the ABS on CAN.
; Calibration of the W210 E220 CDI (210.006, same engine), see src/cars/w202_194/vehicle_config.cpp
[env:w202_194]
build_src_filter = +<*> -<cars/> +<cars/w202_194/>
