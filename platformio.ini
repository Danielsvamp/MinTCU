[env:your_board]
platform = <platform>        ; e.g., espressif32, ststm32, atmelsam, atmelavr
board = <board_id>           ; e.g., esp32dev, nucleo_f103rb
framework = <framework>      ; e.g., arduino, mbed, stm32cube
src_dir = src
build_flags = -Iinclude -DDEBUG
lib_deps =
  ; For libraries from PlatformIO registry, e.g. adafruit/Adafruit_Sensor
monitor_speed = 115200
upload_port = COM3           ; optional, override as needed