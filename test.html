<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Word Viewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@700;800&display=swap');

  :root {
    --bg:       #0d0f0e;
    --surface:  #131615;
    --border:   #1e2421;
    --border2:  #2a322e;
    --accent:   #3dff8f;
    --accent2:  #00c8ff;
    --accent3:  #ff6b35;
    --muted:    #3a4a42;
    --text:     #c8d8d0;
    --text2:    #7a9a88;
    --text3:    #4a6a58;
    --diff-a:   #ff4d4d;   /* value in file A that differs */
    --diff-b:   #ffaa00;   /* value in file B that differs */
    --diff-row: rgba(255,100,30,.07);
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:13px; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100vh; }

  /* ── header ── */
  header { display:flex; align-items:center; gap:9px; padding:7px 14px;
    background:var(--surface); border-bottom:1px solid var(--border);
    flex-shrink:0; flex-wrap:wrap; }
  .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:14px;
    color:var(--accent); letter-spacing:-.02em; white-space:nowrap; margin-right:2px; }
  .logo span { color:var(--text2); font-weight:700; }
  .sep { width:1px; height:18px; background:var(--border2); flex-shrink:0; }
  .btn { background:var(--border); border:1px solid var(--border2); color:var(--text);
    padding:4px 10px; border-radius:4px; cursor:pointer;
    font-family:'JetBrains Mono',monospace; font-size:12px; white-space:nowrap;
    transition:background .1s,border-color .1s,color .1s;
    -webkit-tap-highlight-color:transparent; user-select:none; }
  .btn:hover  { background:var(--border2); }
  .btn.active { background:rgba(61,255,143,.13); border-color:var(--accent); color:var(--accent); }
  .btn-group { display:flex; }
  .btn-group .btn { border-radius:0; border-right-width:0; }
  .btn-group .btn:first-child { border-radius:4px 0 0 4px; }
  .btn-group .btn:last-child  { border-radius:0 4px 4px 0; border-right-width:1px; }
  .btn-icon { padding:3px 9px; font-size:14px; line-height:1; }
  .col-ctrl { display:flex; align-items:center; gap:4px; }
  .col-ctrl span { color:var(--text3); font-size:11px; min-width:54px; text-align:center; }
  .ibox { display:flex; align-items:center; background:var(--border);
    border:1px solid var(--border2); border-radius:4px; overflow:hidden; }
  .ibox input { background:transparent; border:none; outline:none; color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:12px; padding:4px 8px; }
  .ibox input::placeholder { color:var(--text3); }
  .ibox button { background:transparent; border:none; border-left:1px solid var(--border2);
    color:var(--text2); padding:4px 8px; cursor:pointer; font-size:11px;
    font-family:'JetBrains Mono',monospace; }
  .ibox button:hover { color:var(--accent); }

  /* file load buttons */
  .file-btn { position:relative; overflow:hidden; }
  .file-btn input[type=file] { position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0; }
  .file-btn.loaded-a { border-color:#3dff8f55; color:var(--accent); }
  .file-btn.loaded-b { border-color:#ffaa0055; color:#ffaa00; }

  .file-info { color:var(--text3); font-size:10px; white-space:nowrap; margin-left:auto;
    display:flex; flex-direction:column; gap:1px; text-align:right; }
  .fi-a { color:var(--accent); } .fi-a span { color:var(--text3); }
  .fi-b { color:#ffaa00; }       .fi-b span { color:var(--text3); }

  /* ── dropzone (shown when no files loaded) ── */
  #dropzone { flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; border:2px dashed var(--border2);
    margin:20px; border-radius:8px; cursor:pointer;
    transition:border-color .2s,background .2s; }
  #dropzone.drag-over { border-color:var(--accent); background:rgba(61,255,143,.04); }
  #dropzone input[type=file] { display:none; }
  .drop-icon  { font-size:40px; opacity:.3; }
  .drop-title { font-family:'Syne',sans-serif; font-size:18px; font-weight:700; color:var(--text2); }
  .drop-sub   { color:var(--text3); font-size:12px; text-align:center; line-height:1.8; }

  /* ── viewer ── */
  #viewer { display:none; flex-direction:column; flex:1; overflow:hidden; }

  /* ── column header ── */
  #colHeader { display:flex; padding:4px 0 4px 14px; background:var(--surface);
    border-bottom:1px solid var(--border); flex-shrink:0; font-size:10px; font-weight:600;
    letter-spacing:.07em; text-transform:uppercase; color:var(--text3);
    user-select:none; overflow:hidden; white-space:nowrap; }
  .h-off   { flex-shrink:0; }
  .h-cells { display:flex; }
  .h-cell  { flex-shrink:0; text-align:right; padding-right:2px; }

  /* ── dual pane ── */
  #panes { display:flex; flex:1; overflow:hidden; }

  .pane { display:flex; flex-direction:column; flex:1; overflow:hidden; min-width:0; }
  .pane + .pane { border-left:2px solid var(--border2); }

  .pane-label { flex-shrink:0; padding:2px 14px; font-size:10px; letter-spacing:.08em;
    text-transform:uppercase; font-weight:700; }
  .pane-label.la { color:var(--accent); background:rgba(61,255,143,.05);
    border-bottom:1px solid rgba(61,255,143,.12); }
  .pane-label.lb { color:#ffaa00; background:rgba(255,170,0,.05);
    border-bottom:1px solid rgba(255,170,0,.12); }
  .pane-label span { color:var(--text3); font-weight:400; font-size:9px; margin-left:8px; }

  .pane-scroller { flex:1; overflow-y:scroll; overflow-x:hidden; position:relative;
    -webkit-overflow-scrolling:touch; }
  .pane-scroller::-webkit-scrollbar { width:5px; }
  .pane-scroller::-webkit-scrollbar-track { background:var(--bg); }
  .pane-scroller::-webkit-scrollbar-thumb { background:var(--border2); border-radius:3px; }

  .pane-spacer   { position:absolute; top:0; left:0; width:1px; pointer-events:none; }
  .pane-rowshost { position:absolute; top:0; left:0; right:0; }

  /* ── rows ── */
  .row { display:flex; padding:0 0 0 14px; height:22px; align-items:center;
    cursor:default; white-space:nowrap; }
  .row:nth-child(even) { background:rgba(255,255,255,.016); }
  .row:hover  { background:rgba(61,255,143,.05) !important; }
  .row.diff   { background:var(--diff-row) !important; }
  .row.jfl    { background:rgba(0,200,255,.22) !important; transition:background .7s; }
  /* current diff highlight — only on the row, not overriding cell colours */
  .row.curdiff { outline:1px solid rgba(255,170,0,.6); }

  .r-off  { flex-shrink:0; color:var(--text2); font-size:11px;
    padding-right:10px; font-variant-numeric:tabular-nums; }
  .r-cells { display:flex; }
  .r-cell  { flex-shrink:0; text-align:right; padding-right:2px;
    font-variant-numeric:tabular-nums; font-size:12px; overflow:hidden; }
  .r-cell.da { color:var(--diff-a) !important; font-weight:700; }
  .r-cell.db { color:var(--diff-b) !important; font-weight:700; }

  /* ── status bar ── */
  #statusbar { flex-shrink:0; display:flex; gap:14px; align-items:center;
    padding:3px 14px; background:var(--surface); border-top:1px solid var(--border);
    font-size:11px; color:var(--text3); flex-wrap:wrap; min-height:26px; }
  #statusbar strong { color:var(--text2); }
  .acc  { color:var(--accent);  }
  .acc2 { color:var(--accent2); }
  .acc3 { color:var(--accent3); }
  .acc4 { color:#ffaa00; }
  .diff-legend { display:flex; gap:10px; align-items:center; margin-left:auto; }
  .dl { display:flex; gap:4px; align-items:center; }
  .ldot { width:8px; height:8px; border-radius:2px; display:inline-block; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo">W<span>viewer</span></div>

    <!-- file A -->
    <div class="btn file-btn" id="btnA" title="Load File A">
      📂 File A
      <input type="file" id="fileInputA" onchange="loadFile(event,'a')">
    </div>
    <!-- file B -->
    <div class="btn file-btn" id="btnB" title="Load File B">
      📂 File B
      <input type="file" id="fileInputB" onchange="loadFile(event,'b')">
    </div>

    <div class="sep"></div>

    <!-- bit width -->
    <div class="btn-group">
      <button class="btn active" id="btn8"  onclick="setBits(8)">8-bit</button>
      <button class="btn"        id="btn16" onclick="setBits(16)">16-bit</button>
    </div>
    <!-- endian -->
    <div class="btn-group" id="endianGroup">
      <button class="btn active" id="btnBE" onclick="setEndian('big')">BE</button>
      <button class="btn"        id="btnLE" onclick="setEndian('little')">LE</button>
    </div>
    <!-- base -->
    <div class="btn-group">
      <button class="btn active" id="btnDec" onclick="setBase('dec')">DEC</button>
      <button class="btn"        id="btnHex" onclick="setBase('hex')">HEX</button>
    </div>

    <div class="sep"></div>

    <!-- columns -->
    <div class="col-ctrl">
      <button class="btn btn-icon" onclick="adjCols(-1)">−</button>
      <span id="colLabel">16 cols</span>
      <button class="btn btn-icon" onclick="adjCols(+1)">+</button>
    </div>

    <div class="sep"></div>

    <!-- diff navigation -->
    <button class="btn" id="btnDiffPrev" onclick="diffNav(-1)" title="Previous difference">◀ Diff</button>
    <button class="btn" id="btnDiffNext" onclick="diffNav(+1)" title="Next difference">Diff ▶</button>
    <span id="diffStatus" style="font-size:11px;color:var(--text3)"></span>

    <div class="sep"></div>

    <!-- search -->
    <div class="ibox">
      <input id="searchInput" style="width:110px" placeholder="find value…"
             onkeydown="if(event.key==='Enter')srchNext()">
      <button onclick="srchNext()">▶</button>
      <button onclick="srchPrev()">◀</button>
    </div>
    <div class="ibox">
      <input id="jumpInput" style="width:100px" placeholder="jump offset…"
             onkeydown="if(event.key==='Enter')doJump()">
      <button onclick="doJump()">GO</button>
    </div>

    <div class="file-info" id="fileInfo"></div>
  </header>

  <!-- dropzone (pre-load) -->
  <div id="dropzone">
    <div class="drop-icon">⬡</div>
    <div class="drop-title">Load file(s) to begin</div>
    <div class="drop-sub">
      Use <strong style="color:var(--accent)">File A</strong> / <strong style="color:#ffaa00">File B</strong> buttons above, or drag &amp; drop here<br>
      8/16-bit · dec/hex · virtual scroll · diff comparison
    </div>
  </div>

  <!-- viewer -->
  <div id="viewer">
    <div id="colHeader">
      <div class="h-off" id="hdrOff"></div>
      <div class="h-cells" id="hdrCells"></div>
    </div>
    <div id="panes">
      <div class="pane" id="paneA">
        <div class="pane-label la" id="labelA">File A</div>
        <div class="pane-scroller" id="scrollerA">
          <div class="pane-spacer"   id="spacerA"></div>
          <div class="pane-rowshost" id="hostA"></div>
        </div>
      </div>
      <div class="pane" id="paneB" style="display:none">
        <div class="pane-label lb" id="labelB">File B</div>
        <div class="pane-scroller" id="scrollerB">
          <div class="pane-spacer"   id="spacerB"></div>
          <div class="pane-rowshost" id="hostB"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="statusbar">
    <span id="sbOff">offset: —</span>
    <span id="sbVal">value: —</span>
    <span id="sbSrch"></span>
    <div class="diff-legend" id="diffLegend" style="display:none">
      <div class="dl"><div class="ldot" style="background:var(--diff-a)"></div><span>A differs</span></div>
      <div class="dl"><div class="ldot" style="background:var(--diff-b)"></div><span>B differs</span></div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
const ROW_H    = 22;
const OVERSCAN = 8;
const MIN_COLS = 1, MAX_COLS = 64;

let dataA = null, dataB = null;  // Uint8Array
let bits   = 8;
let endian = 'big';
let base   = 'dec';
let cols   = 16;

let totalVals = 0;   // max(valsA, valsB)
let numRows   = 0;

// diff state
let diffRows    = [];   // sorted row indices that contain ≥1 difference
let diffIdx     = -1;   // current position in diffRows

// search state
let srchMatches = [], srchIdx = -1;
let hlSet       = new Set();   // row indices highlighted by search

// virtual scroll state — one per pane
let stateA = { prevFirst:-1, prevLast:-1, raf:false };
let stateB = { prevFirst:-1, prevLast:-1, raf:false };

let cellW = 32, offW = 88;

// sync scroll
let syncLock = false;

// ─────────────────────────────────────────────────────────────────────────────
// File loading
// ─────────────────────────────────────────────────────────────────────────────
// also support drag-drop on the dropzone
const dz = document.getElementById('dropzone');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  const files = [...e.dataTransfer.files];
  if (files[0]) loadFileObj(files[0], 'a');
  if (files[1]) loadFileObj(files[1], 'b');
});

function loadFile(evt, which) {
  const f = evt.target.files[0];
  if (f) loadFileObj(f, which);
  evt.target.value = '';
}

function loadFileObj(f, which) {
  const r = new FileReader();
  r.onload = ev => {
    const data = new Uint8Array(ev.target.result);
    if (which === 'a') {
      dataA = data;
      document.getElementById('btnA').classList.add('loaded-a');
    } else {
      dataB = data;
      document.getElementById('btnB').classList.add('loaded-b');
      document.getElementById('paneB').style.display = 'flex';
      document.getElementById('diffLegend').style.display = 'flex';
    }
    updateFileInfo(f, which);
    clearSearch();
    rebuildDiff();
    initVScroll();
    document.getElementById('dropzone').style.display = 'none';
    document.getElementById('viewer').style.display   = 'flex';
  };
  r.readAsArrayBuffer(f);
}

function updateFileInfo(f, which) {
  const el = document.getElementById(`labelB`.replace('B', which==='a'?'A':'B'));
  // update pane labels
  document.getElementById('label'+(which==='a'?'A':'B')).innerHTML =
    `File ${which.toUpperCase()} <span>${esc(f.name)} · ${f.size.toLocaleString()} B</span>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Options
// ─────────────────────────────────────────────────────────────────────────────
function setBits(b) {
  bits = b;
  document.getElementById('btn8') .classList.toggle('active', b===8);
  document.getElementById('btn16').classList.toggle('active', b===16);
  document.getElementById('endianGroup').style.opacity = b===16?'1':'0.35';
  clearSearch(); rebuildDiff(); initVScroll();
}
function setEndian(e) {
  endian = e;
  document.getElementById('btnBE').classList.toggle('active', e==='big');
  document.getElementById('btnLE').classList.toggle('active', e==='little');
  if (bits===16) { clearSearch(); rebuildDiff(); initVScroll(); }
}
function setBase(b) {
  base = b;
  document.getElementById('btnDec').classList.toggle('active', b==='dec');
  document.getElementById('btnHex').classList.toggle('active', b==='hex');
  clearSearch(); initVScroll();
}
function adjCols(d) {
  cols = Math.max(MIN_COLS, Math.min(MAX_COLS, cols+d));
  document.getElementById('colLabel').textContent = cols+' cols';
  clearSearch(); rebuildDiff(); initVScroll();
}

// ─────────────────────────────────────────────────────────────────────────────
// Value extraction
// ─────────────────────────────────────────────────────────────────────────────
function getVal(data, i) {
  if (!data) return null;
  if (bits === 8) return data[i] ?? null;
  const bo = i*2;
  if (bo+1 >= data.length) return null;
  const a = data[bo]??0, b = data[bo+1]??0;
  return endian==='big' ? (a<<8)|b : (b<<8)|a;
}

function fmtVal(v) {
  if (v === null) return '';
  if (base==='hex') return bits===8
    ? v.toString(16).toUpperCase().padStart(2,'0')
    : v.toString(16).toUpperCase().padStart(4,'0');
  return bits===8
    ? v.toString(10).padStart(3,' ')
    : v.toString(10).padStart(5,' ');
}

function valWidth() {
  const chars = bits===8 ? (base==='dec'?3:2) : (base==='dec'?5:4);
  return Math.ceil(chars * 7.8) + 6;
}

// ─────────────────────────────────────────────────────────────────────────────
// Diff computation
// ─────────────────────────────────────────────────────────────────────────────
// diffMap[vi] = true if value at index vi differs between A and B
let diffMap = new Uint8Array(0);

function rebuildDiff() {
  if (!dataA || !dataB) { diffRows=[]; diffIdx=-1; updateDiffStatus(); return; }

  const valsA = bits===8 ? dataA.length : Math.floor(dataA.length/2);
  const valsB = bits===8 ? dataB.length : Math.floor(dataB.length/2);
  const maxV   = Math.max(valsA, valsB);

  diffMap = new Uint8Array(maxV);
  const rowSet = new Set();
  for (let i=0; i<maxV; i++) {
    const va = getVal(dataA, i);
    const vb = getVal(dataB, i);
    if (va !== vb) { diffMap[i] = 1; rowSet.add(Math.floor(i/cols)); }
  }
  diffRows = [...rowSet].sort((a,b)=>a-b);
  diffIdx  = diffRows.length ? 0 : -1;
  updateDiffStatus();
}

function updateDiffStatus() {
  const el = document.getElementById('diffStatus');
  if (!dataB) { el.textContent=''; return; }
  if (!diffRows.length) { el.innerHTML=`<span class="acc">identical</span>`; return; }
  el.innerHTML = diffIdx>=0
    ? `<span class="acc4">${diffIdx+1}/${diffRows.length} diffs</span>`
    : `<span class="acc4">${diffRows.length} diff${diffRows.length>1?'s':''}</span>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Diff navigation
// ─────────────────────────────────────────────────────────────────────────────
function diffNav(dir) {
  if (!diffRows.length) return;
  diffIdx = (diffIdx + dir + diffRows.length) % diffRows.length;
  updateDiffStatus();
  scrollBothToRow(diffRows[diffIdx], true);
}

function markCurDiff(row) {
  document.querySelectorAll('.row.curdiff').forEach(el=>el.classList.remove('curdiff'));
  ['A','B'].forEach(p => {
    const el = document.getElementById(`vr${p}${row}`);
    if (el) el.classList.add('curdiff');
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// Virtual scroll init
// ─────────────────────────────────────────────────────────────────────────────
function initVScroll() {
  const data = dataA || dataB;
  if (!data) return;

  const valsA   = dataA ? (bits===8?dataA.length:Math.floor(dataA.length/2)) : 0;
  const valsB   = dataB ? (bits===8?dataB.length:Math.floor(dataB.length/2)) : 0;
  totalVals     = Math.max(valsA, valsB);
  numRows       = Math.ceil(totalVals / cols);
  cellW         = valWidth();
  offW          = 88;

  buildHeader();

  ['A','B'].forEach(p => {
    const sp = document.getElementById('spacer'+p);
    const sc = document.getElementById('scroller'+p);
    if (sp) sp.style.height = (numRows*ROW_H)+'px';
    if (sc) sc.scrollTop = 0;
    document.getElementById('host'+p).innerHTML = '';
  });

  stateA = { prevFirst:-1, prevLast:-1, raf:false };
  stateB = { prevFirst:-1, prevLast:-1, raf:false };
  scheduleRender('A');
  if (dataB) scheduleRender('B');
}

function buildHeader() {
  document.getElementById('hdrOff').style.cssText = `width:${offW}px;min-width:${offW}px`;
  document.getElementById('hdrOff').textContent = 'OFFSET';
  const hc = document.getElementById('hdrCells');
  let h = '';
  for (let c=0;c<cols;c++) {
    const rel = bits===8?c:c*2;
    const lbl = base==='hex'
      ? '+'+rel.toString(16).toUpperCase().padStart(bits===8?2:3,'0')
      : '+'+rel;
    h += `<div class="h-cell" style="width:${cellW}px;min-width:${cellW}px">${lbl}</div>`;
  }
  hc.innerHTML = h;
}

// ─────────────────────────────────────────────────────────────────────────────
// Render
// ─────────────────────────────────────────────────────────────────────────────
function scheduleRender(p) {
  const st = p==='A'?stateA:stateB;
  if (st.raf) return;
  st.raf = true;
  requestAnimationFrame(()=>doRender(p));
}

function doRender(p) {
  const st   = p==='A'?stateA:stateB;
  st.raf = false;
  const data = p==='A'?dataA:dataB;
  if (!data) return;

  const sc   = document.getElementById('scroller'+p);
  const host = document.getElementById('host'+p);
  const sv   = sc.scrollTop;
  const vh   = sc.clientHeight || 500;

  const first = Math.max(0,         Math.floor(sv/ROW_H)-OVERSCAN);
  const last  = Math.min(numRows-1, Math.ceil((sv+vh)/ROW_H)+OVERSCAN);
  if (first===st.prevFirst && last===st.prevLast) return;
  st.prevFirst=first; st.prevLast=last;

  const hasDiff = dataA && dataB;
  const valsThis = bits===8?data.length:Math.floor(data.length/2);
  const isCurDiffRow = diffRows[diffIdx];

  let html='';
  for (let r=first;r<=last;r++) {
    const baseIdx = r*cols;
    const byteOff = bits===8?baseIdx:baseIdx*2;
    const offHex  = byteOff.toString(16).toUpperCase().padStart(6,'0');
    const isDiff  = hasDiff && diffRows.includes(r);  // fast enough for typical diff counts
    const isCur   = r===isCurDiffRow;
    const isHL    = hlSet.has(r);
    let cls = 'row';
    if (isDiff) cls+=' diff';
    if (isCur)  cls+=' curdiff';
    if (isHL)   cls+=' hl';

    html += `<div class="${cls}" id="vr${p}${r}"` +
            ` style="position:absolute;top:${r*ROW_H}px;left:0;right:0">`;
    html += `<div class="r-off" style="width:${offW}px;min-width:${offW}px">` +
            `${offHex}<span style="color:var(--text3);font-size:10px"> ${byteOff}</span></div>`;
    html += `<div class="r-cells">`;

    for (let c=0;c<cols;c++) {
      const vi = baseIdx+c;
      if (vi>=totalVals) { html+=`<div class="r-cell" style="width:${cellW}px;min-width:${cellW}px"></div>`; continue; }
      const v   = getVal(data, vi);
      const fmt = v!==null ? fmtVal(v) : '';
      const bo  = bits===8?vi:vi*2;
      let dcls  = 'r-cell';
      if (hasDiff && diffMap[vi]) dcls += p==='A'?' da':' db';
      html += `<div class="${dcls}" style="width:${cellW}px;min-width:${cellW}px"` +
              ` data-vi="${vi}" data-bo="${bo}">${fmt}</div>`;
    }
    html += `</div></div>`;
  }
  host.innerHTML = html;
}

// ─────────────────────────────────────────────────────────────────────────────
// Scroll sync + listeners
// ─────────────────────────────────────────────────────────────────────────────
function onScroll(p) {
  scheduleRender(p);
  if (syncLock) return;
  syncLock = true;
  const other = p==='A'?'B':'A';
  const otherSc = document.getElementById('scroller'+other);
  if (otherSc) otherSc.scrollTop = document.getElementById('scroller'+p).scrollTop;
  syncLock = false;
}

document.getElementById('scrollerA').addEventListener('scroll', ()=>onScroll('A'), {passive:true});
document.getElementById('scrollerB').addEventListener('scroll', ()=>onScroll('B'), {passive:true});

// hover status
['A','B'].forEach(p => {
  document.getElementById('scroller'+p).addEventListener('mousemove', e => {
    const cell = e.target.closest('[data-vi]');
    if (!cell) return;
    const bo = +cell.dataset.bo;
    const vi = +cell.dataset.vi;
    const vA = getVal(dataA, vi), vB = getVal(dataB, vi);
    const hexA = vA!==null ? (bits===8?vA.toString(16).toUpperCase().padStart(2,'0'):vA.toString(16).toUpperCase().padStart(4,'0')) : '—';
    const hexB = vB!==null ? (bits===8?vB.toString(16).toUpperCase().padStart(2,'0'):vB.toString(16).toUpperCase().padStart(4,'0')) : '—';
    document.getElementById('sbOff').innerHTML =
      `offset: <strong>0x${bo.toString(16).toUpperCase().padStart(6,'0')}</strong> / <strong>${bo}</strong>`;
    if (dataA && dataB) {
      const same = vA===vB;
      document.getElementById('sbVal').innerHTML =
        `A: <strong style="color:var(--diff-a)">${vA??'—'}</strong>` +
        ` <span style="color:var(--text3)">0x${hexA}</span>` +
        `&ensp;B: <strong style="color:var(--diff-b)">${vB??'—'}</strong>` +
        ` <span style="color:var(--text3)">0x${hexB}</span>` +
        (same ? `` : ` &ensp;<span class="acc4">≠</span>`);
    } else {
      const v = vA??vB;
      const hex = v!==null?(bits===8?v.toString(16).toUpperCase().padStart(2,'0'):v.toString(16).toUpperCase().padStart(4,'0')):'—';
      document.getElementById('sbVal').innerHTML =
        `value: <strong>${v??'—'}</strong> <span style="color:var(--text3)">0x${hex}</span>`;
    }
  }, {passive:true});
});

// ─────────────────────────────────────────────────────────────────────────────
// Search
// ─────────────────────────────────────────────────────────────────────────────
function doSearch() {
  const data = dataA || dataB; if (!data) return;
  const raw = document.getElementById('searchInput').value.trim();
  if (!raw) { clearSearch(); return; }
  const target = base==='hex'?parseInt(raw,16):parseInt(raw,10);
  const maxV   = bits===8?255:65535;
  if (isNaN(target)||target<0||target>maxV) {
    document.getElementById('sbSrch').innerHTML='<span class="acc3">invalid</span>'; return;
  }
  // search in A first, fall back to B
  const src = dataA || dataB;
  const valsThis = bits===8?src.length:Math.floor(src.length/2);
  srchMatches=[];
  for (let i=0;i<Math.max(totalVals,0);i++) {
    const v = getVal(dataA||dataB, i);
    if (v===target) srchMatches.push(i);
  }
  srchIdx = srchMatches.length?0:-1;
  hlSet.clear();
  for (const vi of srchMatches) hlSet.add(Math.floor(vi/cols));
  updateSrchStatus();
  stateA.prevFirst=stateA.prevLast=-1;
  stateB.prevFirst=stateB.prevLast=-1;
  scheduleRender('A'); if (dataB) scheduleRender('B');
  if (srchIdx>=0) scrollBothToRow(Math.floor(srchMatches[0]/cols), true);
}
function srchNext() {
  if (!srchMatches.length){doSearch();return;}
  srchIdx=(srchIdx+1)%srchMatches.length;
  updateSrchStatus();
  scrollBothToRow(Math.floor(srchMatches[srchIdx]/cols), true);
}
function srchPrev() {
  if (!srchMatches.length) return;
  srchIdx=(srchIdx-1+srchMatches.length)%srchMatches.length;
  updateSrchStatus();
  scrollBothToRow(Math.floor(srchMatches[srchIdx]/cols), true);
}
function clearSearch() {
  srchMatches=[]; srchIdx=-1; hlSet.clear();
  document.getElementById('sbSrch').textContent='';
}
function updateSrchStatus() {
  document.getElementById('sbSrch').innerHTML = srchMatches.length
    ? `<span class="acc">${srchIdx+1}/${srchMatches.length} match${srchMatches.length>1?'es':''}</span>`
    : `<span class="acc3">no matches</span>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Scroll helpers
// ─────────────────────────────────────────────────────────────────────────────
function scrollBothToRow(row, flash) {
  ['A','B'].forEach(p => {
    const sc = document.getElementById('scroller'+p);
    if (!sc) return;
    const top = row*ROW_H;
    const vh  = sc.clientHeight;
    if (top<sc.scrollTop || top+ROW_H>sc.scrollTop+vh)
      sc.scrollTop = Math.max(0, top-vh/2+ROW_H/2);
  });
  if (flash) setTimeout(()=>{
    ['A','B'].forEach(p=>{
      const el=document.getElementById(`vr${p}${row}`);
      if(!el) return;
      el.classList.add('jfl');
      setTimeout(()=>el&&el.classList.remove('jfl'),800);
    });
    markCurDiff(row);
  },80);
}

function doJump() {
  const data=dataA||dataB; if(!data) return;
  const raw=document.getElementById('jumpInput').value.trim();
  let bo;
  if (/^0x/i.test(raw)) bo=parseInt(raw,16);
  else if (/^[0-9a-fA-F]{5,}$/.test(raw)) bo=parseInt(raw,16);
  else bo=parseInt(raw,10);
  if (isNaN(bo)||bo<0||bo>=Math.max(dataA?.length??0,dataB?.length??0)) {
    document.getElementById('sbSrch').innerHTML='<span class="acc3">invalid offset</span>'; return;
  }
  if (bits===16) bo=bo&~1;
  const vi=bits===8?bo:bo/2;
  document.getElementById('sbSrch').innerHTML=
    `<span class="acc2">→ 0x${bo.toString(16).toUpperCase().padStart(6,'0')} / ${bo}</span>`;
  scrollBothToRow(Math.floor(vi/cols), true);
}

// ─────────────────────────────────────────────────────────────────────────────
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
